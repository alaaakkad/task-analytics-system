version: '3.8'

networks:
  public-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  db_data:

services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - data-net
  cache_redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - data-net
  app_01:
    build: ./backend
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - data-net
      - public-net
  app_02:
    build: ./backend
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - data-net
      - public-net
  nginx_lb:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public-net


